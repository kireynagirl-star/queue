<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#153d35">
  <title>จัดการคิวรอเรียก</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brand-icon">▣</div><div><h1>จัดการคิวรอเรียก</h1><p>ระบบจัดการสำหรับพนักงาน</p></div></div>
  <nav class="header-nav"><a class="header-link" href="/staff">ออกคิวใหม่</a><a class="header-link" href="/display" target="_blank" rel="noopener">จอแสดงคิว ↗</a></nav>
</header>
<main class="container">
  <section id="loginPanel" class="panel login-panel">
    <h2>เข้าสู่ระบบพนักงาน</h2><p class="muted">ใส่รหัสผ่านที่ตั้งไว้ในไฟล์ .env</p>
    <form id="loginForm"><label for="password">รหัสผ่านพนักงาน</label><input id="password" type="password" required autocomplete="current-password" placeholder="รหัสผ่าน"><button class="primary" type="submit">เข้าสู่ระบบ</button></form>
    <p id="loginError" class="error" role="alert"></p>
  </section>
  <section id="appPanel" hidden>
    <div class="stats">
      <div class="stat"><span>รอเรียก</span><strong id="waitingCount">0</strong></div>
      <div class="stat"><span>กำลังเรียก</span><strong id="callingCount">0</strong></div>
      <div class="stat"><span>รับสินค้าแล้ว</span><strong id="doneCount">0</strong></div>
    </div>
    <section class="panel">
      <div class="section-heading"><div><h2>คิววันนี้</h2><p class="muted" id="lastUpdated">กำลังโหลดข้อมูล…</p></div><button id="refreshBtn" class="secondary" type="button">↻ รีเฟรช</button></div>
      <div class="search-row"><input id="search" placeholder="ค้นหาเลขคิว ชื่อ ออเดอร์ หรือสินค้า"></div>
      <div id="queueList" class="queue-list"></div>
    </section>
  </section>
  <div id="globalError" class="error" role="alert"></div>
</main>
<footer>คิวรับสินค้า · ข้อมูลใช้ร่วมกันผ่านฐานข้อมูลกลาง</footer>
<script src="/app.js" defer></script>
</body></html>
